name: Coverage

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run tests with coverage
        run: npm test -- --coverage --coverageThreshold='{"global":{"lines":50,"functions":50,"branches":50,"statements":50}}'
